name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Baixar codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Registrar ferramentas
        run: |
          node --version
          npm --version
      - name: Instalar dependencias
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Verificar sintaxe
        run: find src tests scripts -type f \( -name '*.js' -o -name '*.cjs' \) -print0 | xargs -0 -r -n1 node --check
      - name: Testes unitarios selecionados
        run: >-
          node --test --test-concurrency=1
          tests/adaptadorCamposNr33.test.js
          tests/regrasCaracterizacaoNr33.test.js

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Baixar codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Registrar ferramentas
        run: |
          node --version
          npm --version
      - name: Instalar dependencias
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Executar ESLint
        run: npm run lint
      - name: Testes unitarios selecionados
        run: >-
          node --test --test-concurrency=1
          tests/auditoriaCsv.test.js
          tests/camposNr33.test.js
          tests/dashboardIndicadores.test.js
      - name: Gerar build
        run: npm run build

  security:
    name: Seguranca (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - name: Baixar codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Auditar dependencias de producao e desenvolvimento
        working-directory: ${{ matrix.component }}
        run: npm audit --package-lock-only --ignore-scripts --audit-level=high
