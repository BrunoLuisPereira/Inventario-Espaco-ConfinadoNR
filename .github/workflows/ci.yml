name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias do backend
        working-directory: backend
        run: npm ci

      - name: Verificar sintaxe do backend
        working-directory: backend
        run: |
          find src -type f -name "*.js" -print0 | xargs -0 -n1 node --check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias do frontend
        working-directory: frontend
        run: npm ci

      - name: Executar ESLint
        working-directory: frontend
        run: npm run lint

      - name: Gerar build do frontend
        working-directory: frontend
        run: npm run build